name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  # Toda segunda às 6h (Brasília): o HTML pega o título, o Sobre, o Instagram e o celular do painel
  # da Azics. No navegador o site já confere a versão atual; isso só mantém o HTML em dia para o Google.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A seção de avaliações lê GET /public/sites/<slug>/avaliacoes da API da Azics.
      NEXT_PUBLIC_API_URL: https://api.azics.com.br
      NEXT_PUBLIC_SITE_SLUG: minastra
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build estático
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Upload de artefatos
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
